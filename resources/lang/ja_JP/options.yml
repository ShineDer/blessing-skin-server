---
option-saved: オプションを保存しました。
homepage:
  title: ホームページ
  home_pic_url:
    title: ホームページの画像 URL
    hint: ホームページからの相対パスまたは完全な URL。空欄の場合はデフォルト画像を使用します。
  favicon_url:
    title: サイトアイコン
    hint: public/ からの相対パスまたは完全な URL。
    description: 指定する画像は幅と高さが同じである必要があります（空欄の場合はデフォルトアイコンを使用）。
  transparent_navbar:
    title: 透明なナビゲーションバー
    label: ホームページのナビゲーションバーが透明になりますが、ページを下までスクロールすると通常に戻ります。
  hide_intro:
    title: 下部の紹介文を隠す
    label: このオプションを有効にすると、バージョン 2.x と同様にスクロールバーが無効になります。
  fixed_bg:
    title: 背景を固定
    label: このオプションを有効にすると、背景がスクロールバーと一緒にスクロールしなくなります。
  copyright_prefer:
    title: プログラムの著作権表示
    description: 言語ごとに異なるスタイルの著作権表示を指定できます。特定の言語の著作権表示スタイルを編集するには、その言語に切り替えて編集を送信してください。<br><b>警告:</b> 許可なくフッターの著作権表示を改変する行為（削除、著作者の変更、リンク先の変更など）は<b>禁止</b>されています。著作者は関連する責任を追及する権利を留保します。
  copyright_text:
    title: カスタム著作権テキスト
    description: 'カスタム著作権テキストではプレースホルダーが使用できます。例: <code>{site_name}</code> と <code>{site_url}</code>。言語ごとに異なるフッターを指定することもできます。特定の言語のフッターを編集するには、その言語に切り替えて編集を送信してください。'
customJsCss:
  title: カスタム CSS/JavaScript
  message: |
    内容は &lt;style&gt; と &lt;script&gt; タグに追加されます。<br>
    - 便利な例: <a href="https://blessing.netlify.com/css-js.html">カスタム CSS & JavaScript の例</a>
  custom_css: CSS
  custom_js: JavaScript
rate:
  title: スコア
  score_per_storage:
    title: ストレージ
    addon: スコア = 1 KB
  private_score_per_storage:
    title: 非公開ストレージ
    addon: スコア = 1 KB
    hint: 非公開テクスチャをアップロードすると、より多くのスコアを消費します。
  score_per_closet_item:
    title: お気に入り
    addon: スコア = クローゼットアイテム 1 個
  return_score:
    title: スコアの返還
    label: プレイヤー/テクスチャ/クローゼットアイテムの削除後、スコアをユーザーに返還します。
  score_per_player:
    title: プレイヤー
    addon: スコア = プレイヤー 1 人
  user_initial_score: ユーザーの初期スコア
report:
  title: テクスチャの通報
  reporter_score_modification:
    title: 通報送信に必要なスコア
    description: 正の整数を設定すると、新しい通報を送信したユーザーに報酬を与えます。負の値を設定すると通報にスコアが必要になり、通報が解決された場合に保留中のスコアが利用可能になります。0 に設定すると無効になります。
  reporter_reward_score:
    title: 通報が解決された場合、通報者にスコアを報酬として付与
sign:
  title: サインイン
  sign_score:
    title: 付与スコア
    addon1: スコア ～
    addon2: スコア
  sign_gap_time:
    title: 間隔時間
    addon: 時間
  sign_after_zero:
    title: 時刻
    label: ユーザーは毎日 0 時以降にサインインできます。
    hint: これにチェックを入れると、上記のオプションは無視されます。
sharing:
  title: シェア報酬
  score_award_per_texture:
    title: テクスチャをアップロードするごとにアップロード者に付与される報酬
  take_back_scores_after_deletion:
    title: スコアの返還
    label: アップロード者が非公開に設定またはテクスチャを削除した場合、スコアを返還します。
  score_award_per_like:
    title: テクスチャがお気に入りに追加されるごとにアップロード者に付与される報酬
general:
  title: 一般オプション
  site_name: サイト名
  site_description:
    title: サイトの説明
    description: 言語ごとに異なるサイト名と説明を指定することもできます。特定の言語のサイト名または説明文を編集するには、その言語に切り替えて編集を送信してください。
  site_url:
    title: サイト URL
    hint: http(s):// で始まり、スラッシュで終わらないようにしてください。
  register_with_player_name:
    title: プレイヤー名で登録
    label: ユーザー登録時に Minecraft のプレイヤー名を必須にします
  require_verification:
    title: アカウント認証
    label: ユーザーは先にメールアドレスを認証する必要があります。
  regs_per_ip: 1 つの IP あたりの最大アカウント数
  max_upload_file_size:
    title: 最大アップロードサイズ
    hint: 'php.ini で指定された制限: :size'
  max_texture_width:
    title: テクスチャの最大幅
    hint: アップロードできるテクスチャの最大幅。64 の整数倍である必要があります
  player_name_rule:
    title: プレイヤー名の規則
    official: 英字、数字、アンダースコア（Mojang の公式規則）
    cjk: CJK 統合漢字を許可
    utf8: すべての有効な UTF-8 文字を許可（空白を除く）
    custom: カスタム規則を使用（正規表現）
  custom_player_name_regexp:
    title: カスタムプレイヤー名規則
    hint: 上記のオプションが 'custom' に設定されている場合のみ有効です。空欄の場合は任意の文字を許可します。
    placeholder: 正規表現
  player_name_length:
    title: プレイヤー名の長さ
    suffix: 文字
  auto_del_invalid_texture:
    title: 無効なテクスチャ
    label: 無効なテクスチャを自動的に削除します。
    hint: ファイルが存在しなくなったテクスチャレコードをスキンライブラリから削除します。
  allow_downloading_texture:
    title: テクスチャのダウンロード
    label: ユーザーがスキンライブラリアイテムのソースファイルを直接ダウンロードできるようにします。
  status_code_for_private:
    title: 非公開テクスチャへのアクセスを拒否する HTTP コード
  texture_name_regexp:
    title: テクスチャ名の規則
    hint: アップロードされたテクスチャの名前を検証する正規表現。空欄の場合は、一重引用符、二重引用符、バックスラッシュ以外の任意の文字を許可します。
    placeholder: 正規表現
  content_policy:
    title: コンテンツポリシー
    description: テクスチャアップロードページにコンテンツポリシーを表示します。Markdown をサポートしています。特定の言語のコンテンツポリシーを編集するには、その言語に切り替えて編集を送信してください。
announ:
  title: お知らせ
  announcement:
    description: Markdown によるスタイリングをサポートしています。言語ごとに異なるお知らせを指定することもできます。特定の言語のお知らせを編集するには、その言語に切り替えて編集を送信してください。
meta:
  title: SEO <meta> タグ
  meta_keywords:
    title: キーワード
    hint: カンマで区切ってください。
  meta_description:
    title: 説明
    hint: 空欄の場合、「一般オプション」で定義された説明が使用されます。
  meta_extras:
    title: その他のカスタム <meta> タグ
recaptcha:
  recaptcha_invisible:
    title: Invisible
    label: Invisible モードを有効にする
res-warning: このページは上級者専用です。よく理解していない場合は変更しないでください！
resources:
  title: リソースファイル
  hint: サイトで CDN を有効にしている場合は、これらのオプションを確認してください。
  force_ssl:
    title: SSL を強制
    label: すべてのフロントエンドアセットを HTTPS プロトコルで読み込みます。
    hint: 有効にする前に SSL が本当に利用可能か確認してください。
  auto_detect_asset_url:
    title: アセット URL
    label: アセット URL を自動的に決定します。
    description: CDN 配下でアセット URL が誤って生成される場合はこれを無効にしてください。無効の場合、サイト URL が使用されます。
  cache_expire_time:
    title: キャッシュ有効期限
    hint: 秒単位。86400 = 1 日、31536000 = 1 年。
  cdn_address:
    title: フロントエンドアセット CDN
    hint: URL が利用できない場合、フロントエンドファイルは読み込まれません。
    description: |
      指定する CDN URL は <code>/public</code> ディレクトリのミラーを指す必要があります。
      そのディレクトリのすべてのファイルが CDN として読み込まれます。<br>
      <b>確認方法:</b> <code>{CDN URL}/app/manifest.json</code> にアクセスできるか確認してください。
cache:
  title: キャッシュ設定
  clear: キャッシュをクリア
  cleared: キャッシュをクリアしました。
  driver: 現在のキャッシュドライバーは「:driver」です。
  enable_avatar_cache:
    title: アバター
    label: アバターのキャッシュを有効にする
  enable_preview_cache:
    title: テクスチャプレビュー
    label: テクスチャプレビューのキャッシュを有効にする
