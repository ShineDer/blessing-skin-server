score-intro:
  title: スコアとは？
  introduction: |
    スコアシステムは、大量のテクスチャのアップロードやプレイヤーの無闇な登録などを防ぐために使用されます。
    プレイヤーの追加、テクスチャのアップロード、スキンライブラリアイテムのクローゼットへの追加のいずれもスコアを消費します。
    :return-score

    新規ユーザーは最初に :initial_score スコアを獲得し、毎日のサインインで :score-from ～ :score-to スコアを獲得できます。
  will-return-score: プレイヤーの削除、テクスチャのアップロードまたはクローゼットアイテムの追加を行った場合、スコアは返還されます。
  no-return-score: プレイヤーの削除、テクスチャのアップロードまたはクローゼットアイテムの追加を行った場合、スコアは返還されません。
  rates:
    storage: ':score スコア = 1 KB ストレージ'
    player: ':score スコア = プレイヤー 1 人'
    closet: ':score スコア = クローゼットアイテム 1 個'
closet:
  add:
    success: ':name をクローゼットに追加しました。'
    repeated: このテクスチャはすでに追加されています。
    not-found: このテクスチャが見つかりません。
    lack-score: クローゼットに追加するためのスコアが足りません。
  rename:
